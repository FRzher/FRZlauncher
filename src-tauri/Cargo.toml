[package]
name = "frzlauncher"
version = "0.1.0"
description = "Next-Gen High-Performance Modular Minecraft Launcher"
authors = ["FRZlauncher Team"]
edition = "2021"

[lib]
name = "frzlauncher_lib"
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2.0", features = [] }

[dependencies]
tauri = { version = "2.2", features = ["tray-icon"] }
tauri-plugin-shell = "2.2"
tauri-plugin-fs = "2.2"
tauri-plugin-dialog = "2.2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.43", features = ["full"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream", "json", "socks"] }
futures-util = "0.3"
keyring = { version = "3.6", features = ["windows-native"] }
sha1 = "0.10"
sha2 = "0.10"
hex = "0.4"
uuid = { version = "1.13", features = ["v3", "v4", "serde"] }
sysinfo = "0.33"
regex = "1.11"
thiserror = "2.0"
anyhow = "1.0"
chrono = { version = "0.4", features = ["serde"] }
dirs = "6.0"
tracing = "0.1"
tracing-subscriber = "0.3"
urlencoding = "2.1"
zip = { version = "2.2", default-features = false, features = ["deflate"] }
open = "5.4"
discord-rich-presence = "1.1.0"

[profile.dev]
debug = 1
incremental = false

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
